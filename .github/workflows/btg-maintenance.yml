name: Publish and grade official picks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btg-maintenance.yml'
  schedule:
    - cron: '2-57/5 * * * *'
permissions: {}
concurrency:
  group: btg-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BTG_MAINTENANCE_TOKEN: ${{ secrets.BTG_MAINTENANCE_TOKEN }}
    steps:
      - name: Check that betthisguy.com is up
        shell: python
        env:
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          BTG_SITE_URL: https://betthisguy.com
        run: |
          import json, os, time, urllib.parse, urllib.request

          site = os.environ["BTG_SITE_URL"].rstrip("/")

          def check():
              with urllib.request.urlopen(urllib.request.Request(site + "/", headers={"User-Agent": "BetThisGuy-HealthCheck/1.0"}), timeout=20) as page:
                  if page.status != 200 or b"Bet This Guy" not in page.read():
                      return "home page returned unexpected content"
              with urllib.request.urlopen(urllib.request.Request(site + "/api/record", headers={"User-Agent": "BetThisGuy-HealthCheck/1.0", "Accept": "application/json"}), timeout=20) as record:
                  if json.load(record).get("success") is not True:
                      return "results API did not report success"
              return None

          problem = None
          for attempt in range(2):
              try:
                  problem = check()
              except Exception as exc:
                  problem = getattr(exc, "code", None) and "HTTP " + str(exc.code) or type(exc).__name__
              if not problem:
                  print("site: up")
                  raise SystemExit(0)
              print("site: " + problem)
              if attempt == 0:
                  time.sleep(15)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## Bet This Guy is down\n\n- Problem: **" + problem + "**\n- Checked: " + site + "\n")
          topic = os.environ.get("ALERT_NTFY_TOPIC", "")
          if topic:
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      "https://ntfy.sh/" + urllib.parse.quote(topic, safe=""),
                      data=("betthisguy.com check failed: " + problem + "\nThe scheduler checks again every five minutes.").encode(),
                      headers={"Title": "Bet This Guy: site is down", "Priority": "urgent", "Tags": "rotating_light"},
                      method="POST"), timeout=10)
              except Exception as exc:
                  print("alert: " + type(exc).__name__)
          raise SystemExit("betthisguy.com is down: " + problem)

      - name: Run publishing, grading and closing-price capture
        shell: python
        run: |
          import concurrent.futures, datetime, json, os, time, urllib.error, urllib.request

          token = os.environ.get("BTG_MAINTENANCE_TOKEN", "")
          if len(token) < 32:
              raise SystemExit("BTG_MAINTENANCE_TOKEN must be configured before activation")

          now = datetime.datetime.now(datetime.timezone.utc)
          weekday, hour = now.weekday(), now.hour
          active_window = (
              (weekday == 2 and hour >= 12)
              or weekday == 3
              or (weekday == 4 and hour < 8)
              or (weekday == 5 and hour >= 12)
              or weekday in (6, 0)
              or (weekday == 1 and hour < 8)
          )
          forced = os.environ.get("GITHUB_EVENT_NAME") in ("workflow_dispatch", "push")
          quiet_checkpoint = hour % 6 == 0 and now.minute < 10

          jobs = []
          mode = "active NFL window" if active_window else "quiet period"
          if forced:
              mode, jobs = "verification run", ["publish", "grade", "closing"]
          elif active_window:
              # Closing-line capture runs on the Cloudflare cron in closing-cron/.
              if (now.minute // 5) % 2 == 0:
                  jobs.append("grade")
              if (now.minute // 5) % 3 == 0:
                  jobs.append("publish")
          elif quiet_checkpoint:
              jobs = ["publish", "grade"]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          def write_summary(lines):
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("\n".join(lines) + "\n")

          if not jobs:
              print(mode + ": no provider calls needed")
              write_summary([
                  "## Bet This Guy maintenance",
                  "",
                  "- Status: **Healthy — no jobs due**",
                  "- Mode: **" + mode + "**",
                  "- Provider calls: **0**",
                  "- Checked: " + now.isoformat(),
              ])
              raise SystemExit(0)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)

          def run(job):
              last_error = "unknown error"
              for attempt in range(2):
                  try:
                      request = urllib.request.Request(
                          "https://betthisguy.com/api/maintenance?job=" + job,
                          data=b"", method="POST",
                          headers={
                              "Authorization": "Bearer " + token,
                              "Accept": "application/json",
                              "User-Agent": "BetThisGuy-Maintenance/1.0",
                          })
                      with opener.open(request, timeout=90) as response:
                          result = json.load(response)
                      if result.get("success") is not True:
                          raise RuntimeError("Job did not complete")
                      print(job + ": completed")
                      return job, True, "completed"
                  except urllib.error.HTTPError as exc:
                      last_error = "HTTP " + str(exc.code)
                  except Exception as exc:
                      last_error = type(exc).__name__
                  print(job + ": " + last_error)
                  if attempt == 0:
                      time.sleep(10)
              return job, False, last_error

          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as executor:
              results = list(executor.map(run, jobs))

          failures = [job + " (" + detail + ")" for job, ok, detail in results if not ok]
          write_summary([
              "## Bet This Guy maintenance",
              "",
              "- Status: **" + ("Failed" if failures else "Healthy") + "**",
              "- Mode: **" + mode + "**",
              "- Jobs: **" + ", ".join(jobs) + "**",
              "- Completed: " + now.isoformat(),
              "",
              "| Job | Result |",
              "| --- | --- |",
              *["| " + job + " | " + ("Completed" if ok else detail) + " |" for job, ok, detail in results],
          ])
          if failures:
              raise SystemExit("Maintenance failed: " + ", ".join(failures))
