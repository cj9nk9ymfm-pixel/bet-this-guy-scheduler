name: Smoke test (live site)
# Read-only checks of the live site's feeds, player stats and live tracker.
# Run by hand from the Actions tab: choose the sport and, during a game, how
# many minutes to poll the live box score.
on:
  workflow_dispatch:
    inputs:
      sport:
        description: NBA or NFL
        default: NBA
      poll_minutes:
        description: Minutes to poll a live game's box score (0 = skip)
        default: "0"
      players:
        description: Players to look up when no odds are posted (Name|Team;Name|Team)
        default: ""
      mode:
        description: smoke, or fair (compare fair prices all books vs big five)
        default: smoke
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        env:
          SPORT: ${{ inputs.sport }}
          POLL_MINUTES: ${{ inputs.poll_minutes }}
          PLAYERS: ${{ inputs.players }}
        run: if [ "${{ inputs.mode }}" = "fair" ]; then python3 scripts/fair_compare.py; else python3 scripts/smoke.py; fi
